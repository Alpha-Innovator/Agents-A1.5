<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 488" fill="none">
  <!-- Decorative domain motifs; no chart values or scientific measurements. -->
  <defs>
    <radialGradient id="halo">
      <stop stop-color="#8463ef" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8463ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="420" y1="100" x2="681" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0d3ff"/>
      <stop offset=".45" stop-color="#ab8cf8"/>
      <stop offset="1" stop-color="#6650c5"/>
    </linearGradient>
    <linearGradient id="mint" x1="490" y1="288" x2="663" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#adf1e1"/>
      <stop offset="1" stop-color="#62aab1"/>
    </linearGradient>
    <linearGradient id="glass" x1="536" y1="216" x2="607" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bca2ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7d5bd3" stop-opacity=".05"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <ellipse cx="567" cy="246" rx="226" ry="206" fill="url(#halo)"/>
  <g stroke="#ac90ea" stroke-width=".8" opacity=".29">
    <ellipse cx="564" cy="246" rx="210" ry="165" transform="rotate(-22 564 246)"/>
    <ellipse cx="564" cy="246" rx="229" ry="185" transform="rotate(-22 564 246)"/>
    <path d="M374 246h380M567 54v381" stroke-dasharray="3 10" opacity=".6"/>
  </g>

  <!-- An evidence path connects the three scientific domains. -->
  <path d="M463 164C489 119 629 110 675 179S682 322 578 350 437 254 463 164Z"
        stroke="url(#violet)" stroke-width="1.3" opacity=".35"/>
  <g stroke="url(#violet)" stroke-width="1.15" opacity=".48">
    <path d="M476 183C514 195 535 207 555 233"/>
    <path d="M645 199C616 208 597 222 578 240"/>
    <path d="M578 320C574 298 571 278 571 261"/>
  </g>
  <g fill="#c5b2ff">
    <circle cx="516" cy="204" r="2.8"/>
    <circle cx="614" cy="216" r="2.8"/>
    <circle cx="574" cy="296" r="2.8"/>
  </g>

  <!-- Physics: coherent, intersecting orbital traces. -->
  <g stroke="url(#violet)" stroke-width="2">
    <ellipse cx="459" cy="158" rx="62" ry="24" transform="rotate(-18 459 158)"/>
    <ellipse cx="459" cy="158" rx="62" ry="24" transform="rotate(42 459 158)" opacity=".85"/>
    <ellipse cx="459" cy="158" rx="62" ry="24" transform="rotate(102 459 158)" opacity=".68"/>
  </g>
  <circle cx="459" cy="158" r="16" fill="#b399ff" opacity=".34" filter="url(#glow)"/>
  <circle cx="459" cy="158" r="6" fill="#ded0ff"/>
  <circle cx="516" cy="140" r="4.5" fill="#d6c5ff"/>
  <circle cx="426" cy="114" r="3.5" fill="#aa90ed"/>

  <!-- Chemistry: two connected molecular rings. -->
  <g stroke="url(#violet)" stroke-width="2.2" stroke-linejoin="round">
    <path d="m642 142 37 21v43l-37 21-37-21v-43Z" fill="#8f6ed9" fill-opacity=".065"/>
    <path d="m679 163 36-21 37 21v43l-37 21-36-21" fill="#8f6ed9" fill-opacity=".065"/>
    <path d="m614 169 28-16 27 16m0 30-27 16m-28-16v-24m74-6 27-16 27 16m0 30-27 16" opacity=".5" stroke-width="1.3"/>
  </g>
  <g fill="#d3bfff" stroke="#1d1737" stroke-width="3">
    <circle cx="642" cy="142" r="5.5"/>
    <circle cx="679" cy="206" r="5.5"/>
    <circle cx="752" cy="163" r="5.5"/>
  </g>

  <!-- Biology: a paired helix with regularly spaced connecting bases. -->
  <g transform="translate(496 302) rotate(-9 83 40)">
    <g stroke="url(#mint)" stroke-width="1.5" opacity=".65">
      <path d="M7 9v54m17-42v30m17-18v6m17-23v40m17-52v64m17-55v62m17-53v43m17-30v13m17-7v8m17-26v45"/>
    </g>
    <path d="M0 4C37 4 46 72 83 72S129 4 166 4" stroke="#8ed6cd" stroke-width="3.2"/>
    <path d="M0 72C37 72 46 4 83 4S129 72 166 72" stroke="url(#violet)" stroke-width="3.2"/>
    <g fill="#c1f2e7">
      <circle cx="0" cy="4" r="4"/>
      <circle cx="83" cy="72" r="4"/>
      <circle cx="166" cy="4" r="4"/>
    </g>
  </g>

  <!-- Verification is the shared narrative motif, not a score or outcome. -->
  <circle cx="568" cy="247" r="43" fill="#a58afa" opacity=".13" filter="url(#glow)"/>
  <circle cx="568" cy="247" r="34" fill="#12101f" stroke="#bda3f3" stroke-width="1.2" stroke-opacity=".65"/>
  <circle cx="568" cy="247" r="29" fill="url(#glass)"/>
  <path d="m554 247 10 10 19-21" stroke="#d4c2ff" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#b39bdc" opacity=".5">
    <circle cx="394" cy="298" r="1.4"/><circle cx="706" cy="309" r="1.4"/>
    <circle cx="585" cy="90" r="1.4"/><circle cx="683" cy="380" r="1.4"/>
    <circle cx="457" cy="375" r="1.4"/><circle cx="733" cy="263" r="1.4"/>
  </g>
</svg>
