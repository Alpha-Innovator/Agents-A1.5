<script>
/* Preserve each author's language controls and return to the same catalog language. */
(() => {
  const links = [...document.querySelectorAll('[data-showcase-home], [data-showcase-return]')];
  const home = links[0].getAttribute('href').split('?')[0];
  const label = document.querySelector('[data-showcase-return-label]');
  const update = () => {
    const lang = document.documentElement.lang.startsWith('en') ? 'en' : 'zh';
    links.forEach(link => {
      link.setAttribute('href', home + '?lang=' + lang);
      link.setAttribute('aria-label', lang === 'en' ? 'Back to showcase home' : '返回展示首页');
    });
    label.textContent = lang === 'en' ? 'Back to home' : '返回首页';
  };
  update();
  new MutationObserver(update).observe(document.documentElement, {
    attributes: true, attributeFilter: ['lang']
  });
})();

</script>
